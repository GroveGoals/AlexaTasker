<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AlexaTasker Dashboard</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f1115;
    color: #e5e7eb;
    margin: 0;
    padding: 2rem;
  }
  .container { max-width: 600px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
  .subtitle { color: #9ca3af; margin-bottom: 2rem; }
  .add-form {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1.5rem;
  }
  input[type="text"], input[type="date"] {
    background: #1a1d24;
    border: 1px solid #2d3139;
    color: #e5e7eb;
    padding: 0.6rem;
    border-radius: 8px;
    font-size: 0.95rem;
  }
  input[type="text"] { flex: 1; }
  button {
    background: #3b82f6;
    color: white;
    border: none;
    padding: 0.6rem 1rem;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.95rem;
  }
  button:hover { background: #2563eb; }
  .task {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    background: #1a1d24;
    border: 1px solid #2d3139;
    padding: 0.75rem 1rem;
    border-radius: 8px;
    margin-bottom: 0.5rem;
  }
  .task-title { flex: 1; }
  .task-due { color: #9ca3af; font-size: 0.85rem; }
  .done-btn {
    background: #16a34a;
    padding: 0.3rem 0.7rem;
    font-size: 0.85rem;
  }
  .plan-btn {
    background: #7c3aed;
    width: 100%;
    margin-top: 1rem;
    padding: 0.75rem;
  }
  .plan-output {
    background: #1a1d24;
    border: 1px solid #2d3139;
    border-radius: 8px;
    padding: 1rem;
    margin-top: 1rem;
    white-space: pre-wrap;
    font-size: 0.9rem;
    display: none;
  }
  .empty { color: #6b7280; text-align: center; padding: 1rem; }
</style>
</head>
<body>
  <div class="container">
    <h1>AlexaTasker</h1>
    <p class="subtitle">Task management for Alexa+ — MCP demo dashboard</p>

    <div class="add-form">
      <input type="text" id="taskInput" placeholder="Add a task..." />
      <input type="date" id="dueInput" />
      <button onclick="addTask()">Add</button>
    </div>

    <div id="taskList"></div>

    <button class="plan-btn" onclick="planDay()">✨ Plan My Day</button>
    <div id="planOutput" class="plan-output"></div>
  </div>

  <script>
    const API_BASE = "https://alexatasker.onrender.com";

    async function callTool(name, args = {}) {
      const res = await fetch(`${API_BASE}/mcp`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          jsonrpc: "2.0",
          id: Date.now(),
          method: "tools/call",
          params: { name, arguments: args },
        }),
      });
      return res.json();
    }

    async function addTask() {
      const title = document.getElementById("taskInput").value.trim();
      const dueDate = document.getElementById("dueInput").value;
      if (!title) return;
      await callTool("add_task", dueDate ? { title, dueDate } : { title });
      document.getElementById("taskInput").value = "";
      document.getElementById("dueInput").value = "";
      loadTasks();
    }

    async function completeTask(id) {
      await callTool("complete_task", { id });
      loadTasks();
    }

    async function loadTasks() {
      const result = await callTool("list_tasks", {});
      const text = result?.result?.content?.[0]?.text || "No tasks found.";
      const listEl = document.getElementById("taskList");
      if (text === "No tasks found.") {
        listEl.innerHTML = '<div class="empty">No tasks yet — add one above.</div>';
        return;
      }
      // NOTE: this simple parser assumes list_tasks output format; a real
      // implementation would have the server return structured JSON too.
      listEl.innerHTML = text
        .split("\n")
        .map((line) => `<div class="task"><span class="task-title">${line.replace(/^- /, "")}</span></div>`)
        .join("");
    }

    async function planDay() {
      const result = await callTool("plan_day", {});
      const text = result?.result?.content?.[0]?.text || "No plan available.";
      const out = document.getElementById("planOutput");
      out.textContent = text;
      out.style.display = "block";
    }

    loadTasks();
  </script>
</body>
</html>
