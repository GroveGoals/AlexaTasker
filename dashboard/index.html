<script>
    const API_BASE = "https://alexatasker.onrender.com";

    function showError(msg) {
      const listEl = document.getElementById("taskList");
      listEl.innerHTML = `<div style="color:#b00020; font-family:sans-serif; font-size:0.85rem;">Error: ${msg}</div>`;
    }

    async function callTool(name, args = {}) {
      try {
        const res = await fetch(`${API_BASE}/mcp`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json, text/event-stream"
          },
          body: JSON.stringify({
            jsonrpc: "2.0",
            id: Date.now(),
            method: "tools/call",
            params: { name, arguments: args },
          }),
        });
        if (!res.ok) {
          throw new Error(`Server responded with status ${res.status}`);
        }
        return await res.json();
      } catch (err) {
        showError(err.message);
        throw err;
      }
    }

    function parseTasksJson(result) {
      const blocks = result?.result?.content || [];
      for (const block of blocks) {
        try {
          const parsed = JSON.parse(block.text);
          if (Array.isArray(parsed)) return parsed;
        } catch (e) {}
      }
      return null;
    }

    async function addTask() {
      const title = document.getElementById("taskInput").value.trim();
      const dueDate = document.getElementById("dueInput").value;
      if (!title) return;
      try {
        await callTool("add_task", dueDate ? { title, dueDate } : { title });
        document.getElementById("taskInput").value = "";
        document.getElementById("dueInput").value = "";
        loadTasks();
      } catch (e) {}
    }

    async function completeTaskById(id) {
      try {
        await callTool("complete_task", { id });
        loadTasks();
      } catch (e) {}
    }

    async function loadTasks() {
      try {
        const result = await callTool("list_tasks", {});
        const tasks = parseTasksJson(result);
        const listEl = document.getElementById("taskList");

        if (!tasks || tasks.length === 0) {
          listEl.innerHTML = '<div class="empty">Nothing on the list yet.</div>';
          return;
        }

        listEl.innerHTML = tasks
          .map(
            (t) => `
            <div class="task">
              <span>
                <span class="task-title">${t.title}</span>
                ${t.dueDate ? `<span class="task-due">due ${t.dueDate}</span>` : ""}
              </span>
              <button class="done-btn" onclick="completeTaskById('${t.id}')">done</button>
            </div>
          `
          )
          .join("");
      } catch (e) {}
    }

    async function planDay() {
      try {
        const result = await callTool("plan_day", {});
        const text = result?.result?.content?.[0]?.text || "No plan available.";
        const out = document.getElementById("planOutput");
        out.textContent = text;
        out.style.display = "block";
      } catch (e) {}
    }

    loadTasks();
  </script>
